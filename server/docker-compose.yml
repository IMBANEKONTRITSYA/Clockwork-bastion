# Локальный сервер для разработки: Nakama + PostgreSQL. Запуск: make server-up.
# Пароли здесь — только для локальной машины; продакшен-конфиг — отдельный файл (этап 06).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10

  nakama:
    image: heroiclabs/nakama:3.42.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up --database.address postgres:localdev@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml
        --database.address postgres:localdev@postgres:5432/nakama
    volumes:
      - ./build:/nakama/data/modules:ro
      - ./local.yml:/nakama/data/local.yml:ro
    ports:
      - "7349:7349" # gRPC API
      - "7350:7350" # HTTP API клиента
      - "7351:7351" # консоль администратора
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
