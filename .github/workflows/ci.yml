name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Кэш Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Установка Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"

      - name: Импорт проекта
        run: ~/godot/godot --headless --path client --import || true

      - name: Данные баланса
        run: make data

      - name: Линт GDScript
        run: |
          gdlint client/sim client/game client/meta client/services
          gdformat --check client/sim client/game client/meta client/services

      - name: Тесты клиента
        run: make test-client GODOT=~/godot/godot

      - name: Детерминизм
        run: make determinism GODOT=~/godot/godot

      - name: Эталонные журналы (временно, для фикстур)
        if: always()
        run: ~/godot/godot --headless --path client --script res://tools/determinism_check.gd -- --print-fixtures 101,202,303

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
